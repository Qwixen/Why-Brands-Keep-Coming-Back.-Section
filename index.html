<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="brand">
        <div class="container">
            <div class="h1-text">
                <h1 class="gray">Why Brands Keep</h1>
                <h1>Coming Back.</h1>
            </div>

            <div class="card-part">
                <div class="card">
                    <img src="image/dollar.png" alt="Card Image" class="img">
                    <div class="card-content">
                        <h2 class="card-text">Designs that convert</h2>
                        <p class="card-text-p">Built for today, flexible for what's next.</p>
                    </div>
                </div>

                <div class="card">
                    <img src="image/pen.png" alt="Card Image" class="img">
                    <div class="card-content">
                        <h2 class="card-text">Thoughtful, not trendy</h2>
                        <p class="card-text-p">Our work is grounded in purpose, not passing fads.</p>
                    </div>
                </div>

                <div class="card">
                    <img src="image/cursor.png" alt="Card Image" class="img">
                    <div class="card-content">
                        <h2 class="card-text">Fast without the fuss</h2>
                        <p class="card-text-p">A streamlined process. quick, clean, no chaos.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
